    margin:0;

    color:var(--ink);
    background:var(--bg);
    transition:background .4s ease, color .4s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    gap:clamp(10px,2.5vh,24px);
    padding:max(18px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
    /* a stray drag must never start a text selection or a double-tap zoom —
       either one swallows the tap and the buzzer feels dead */
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }

  /* ---- stage ---- */
  .stage{
    flex:1 1 auto;
    position:relative;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    width:100%;
    min-height:0;
  }
  /* shown to someone sitting opposite: only the toy turns. The tap halves sit
     outside this element, so left stays left for whoever holds the phone. */
  .tapzone{
    display:block;
    perspective:1400px;
    transition:transform .5s cubic-bezier(.3,.8,.35,1);
  }
  .tapzone.facing{transform:rotate(180deg)}

  /* the toy itself is a target: left half ○, right half × */
  .half{
    position:absolute;top:0;bottom:0;width:50%;
    margin:0;padding:0;border:0;background:transparent;
    pointer-events:auto;cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
  }
  .half.left{left:0}
  .half.right{right:0}
  .half:focus-visible{outline:3px solid var(--ink);outline-offset:-8px;border-radius:24px}

  .paddle{
    position:relative;
    width:var(--d);
    height:calc(var(--d) * 1.72);
    transform-style:preserve-3d;
    transform-origin:50% 90%;
    transition:transform .58s cubic-bezier(.18,.86,.24,1);
  }
  .paddle.pop{animation:buzz .62s cubic-bezier(.25,.7,.35,1)}
  @keyframes buzz{
    0%  {translate:0 0;      rotate:0deg}
    7%  {translate:-5px -7px;rotate:-2.6deg}
    18% {translate:5px -3px; rotate:2.2deg}
    30% {translate:-4px -1px;rotate:-1.6deg}
    43% {translate:3px 0;    rotate:1.15deg}
    57% {translate:-2px 0;   rotate:-.75deg}
    72% {translate:2px 0;    rotate:.45deg}
    86% {translate:-1px 0;   rotate:-.2deg}
    100%{translate:0 0;      rotate:0deg}
  }

  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;
  }
  .face.back{transform:rotateY(180deg)}

  .nub{
    width:calc(var(--d)*.085);height:calc(var(--d)*.062);
    background:linear-gradient(180deg,#FFF,#DAD8D1);
    border:1px solid var(--plastic-edge);
    border-bottom:0;
    border-radius:4px 4px 0 0;
    margin-bottom:-2px;
  }

  .disc{
    position:relative;
    width:var(--d);height:var(--d);
    border-radius:50%;
    background:radial-gradient(78% 66% at 32% 22%, #FFFFFF 0%, #FBFBF9 42%, #EDEBE5 100%);
    border:1px solid var(--plastic-edge);
    box-shadow:
      inset 0 -10px 22px rgba(0,0,0,.07),
      inset 0 4px 10px rgba(255,255,255,.9),
      var(--rim);
    display:grid;place-items:center;
  }

  .ring{
    width:calc(var(--d)*.70);height:calc(var(--d)*.70);
    border-radius:50%;
    border:calc(var(--d)*.145) solid var(--maru);
    box-shadow:0 1px 0 rgba(0,0,0,.06);
  }

  .cross{position:absolute;width:100%;height:100%;display:grid;place-items:center}
  .cross i{
    position:absolute;
    width:calc(var(--d)*.80);height:calc(var(--d)*.145);
    background:linear-gradient(180deg,#2A62C4,#1B4EA8);
    border-radius:2px;
  }
  .cross i:first-child{transform:rotate(45deg)}
  .cross i:last-child{transform:rotate(-45deg)}

  .clapmark{position:absolute;width:100%;height:100%;display:grid;place-items:center}
  .clapimg{display:block;background:var(--clap-img) center/contain no-repeat}
  .clapmark .clapimg{width:calc(var(--d)*.62);height:calc(var(--d)*.62)}

  /* each face renders whichever mark it is currently assigned */
  .face .ring,.face .cross,.face .clapmark{display:none}
  .face[data-mark="maru"] .ring{display:block}
  .face[data-mark="batsu"] .cross{display:grid}
  .face[data-mark="clap"] .clapmark{display:grid}
  .face[data-mark="clap"] .grille{display:none}
  .face[data-mark="maru"] .pulse{color:var(--maru)}
  .face[data-mark="batsu"] .pulse{color:var(--batsu)}
  .face[data-mark="clap"] .pulse{color:var(--clap)}

  .ring,.cross,.clapmark{transition:opacity .55s ease}
  .face.hide .ring,.face.hide .cross,.face.hide .clapmark{opacity:0}

  .grille{
    position:absolute;
    width:calc(var(--d)*.30);height:calc(var(--d)*.30);
    border-radius:50%;
    background-image:radial-gradient(circle, rgba(20,20,20,.62) 1.5px, transparent 1.7px);
    background-size:calc(var(--d)*.038) calc(var(--d)*.038);
    background-position:center;
  }

  .handle{
    width:calc(var(--d)*.235);
    height:calc(var(--d)*.76);
    margin-top:calc(var(--d)*-.035);
    border-radius:0 0 calc(var(--d)*.06) calc(var(--d)*.06);
    background:linear-gradient(90deg,#EFEDE7 0%,#FFFFFF 26%,#FCFCFA 62%,#DEDCD5 100%);
    border:1px solid var(--plastic-edge);
    border-top:0;
    position:relative;
    box-shadow:0 16px 22px -16px rgba(0,0,0,.45);
  }
  .btn-dot{
    position:absolute;left:50%;top:calc(var(--d)*.055);translate:-50% 0;
    width:calc(var(--d)*.115);height:calc(var(--d)*.115);
    border-radius:50%;
    background:radial-gradient(70% 70% at 40% 32%,#FFF,#E4E2DB);
    border:1px solid var(--plastic-edge);
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.1);
  }
  .seam{
    position:absolute;left:14%;right:14%;bottom:calc(var(--d)*.16);
    height:1px;background:rgba(0,0,0,.12);
  }

  .contact{
    position:absolute;left:50%;bottom:calc(var(--d)*-.05);
    translate:-50% 0;
    width:calc(var(--d)*.9);height:calc(var(--d)*.09);
    background:radial-gradient(50% 50% at 50% 50%, var(--contact), transparent 70%);
    filter:blur(3px);pointer-events:none;
  }
  .pulse{
    position:absolute;left:50%;top:calc(var(--d)*.5);
    translate:-50% -50%;
    width:var(--d);height:var(--d);border-radius:50%;
    border:2px solid currentColor;
    opacity:0;pointer-events:none;
  }
  .pulse.go{animation:pulse .7s ease-out}
  @keyframes pulse{
    0%{opacity:.55;scale:.86}
    100%{opacity:0;scale:1.5}
  }

  /* ---- controls ---- */
  .controls{
    flex:0 0 auto;
    display:flex;gap:0;justify-content:center;
    width:calc(100% + 40px);
    margin:0 -20px calc(-1 * max(22px, env(safe-area-inset-bottom)));
    padding:0;
  }
  .key{
    flex:1 1 50%;
    position:relative;overflow:hidden;
    height:clamp(120px, 20vh, 190px);
    padding-bottom:max(0px, env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:0;
    background:linear-gradient(180deg,var(--key-a),var(--key-b));
    box-shadow:0 -6px 22px -14px rgba(0,0,0,.5);
    font-family:inherit;
    color:var(--ink);cursor:pointer;
    touch-action:manipulation;
    transition:background .4s ease, color .4s ease, filter .08s ease;
  }
  /* outer top corners sweep up; the pair meets in the middle */
  .key.maru {border-radius:44px 0 0 0; border-right:1px solid var(--key-edge)}
  .key.batsu{border-radius:0 44px 0 0}

  /* soft colour bloom rising from the outer corner */
  .key::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(72% 92% at var(--bloom-x) 112%, var(--tint) 0%, transparent 68%);
  }
  .key.maru {--tint:rgba(223,50,41,.22); --bloom-x:16%}
  .key.batsu{--tint:rgba(30,86,182,.24); --bloom-x:84%}

  .key:active{filter:brightness(.93)}
  .key:focus-visible{outline:3px solid var(--ink);outline-offset:-6px}
  .key .glyph{
    position:relative;
    font-size:clamp(58px,18vw,96px);line-height:1;font-weight:400;
  }
  .key.maru .glyph{color:var(--maru)}
  .key.batsu .glyph{color:var(--batsu)}
  html[data-theme="dark"] .key.maru .glyph{color:#F4584D}
  html[data-theme="dark"] .key.batsu .glyph{color:#5D8FEC}

  /* ---- clap (sits above the maru/batsu pair) ---- */
  .clapbar{
    flex:0 0 auto;
    display:flex;justify-content:center;width:100%;
  }
  .clapkey{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:11px 28px;
    border-radius:999px;
    border:1px solid var(--key-edge);
    background:linear-gradient(180deg,var(--key-a),var(--key-b));
    color:var(--ink);
    font:800 14px/1 var(--jp);letter-spacing:.14em;text-indent:.14em;
    cursor:pointer;
    box-shadow:0 12px 26px -18px rgba(0,0,0,.7);
    transition:background .4s ease, color .4s ease, filter .08s ease;
  }
  .clapkey:active{filter:brightness(.93)}
  .clapkey:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
  .clapkey .clapimg{width:26px;height:26px;flex:0 0 auto}

  /* ---- info ---- */
  .corner{
    position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;
    display:flex;gap:8px;z-index:5;
  }
  .corner-under{
    position:fixed;top:max(48px,calc(env(safe-area-inset-top) + 38px));right:12px;
    display:flex;gap:8px;z-index:5;
  }
  .chip[aria-pressed="true"].turn{
    opacity:1;color:var(--ink);
    border-color:var(--ink-soft);
  }
  .chip.turn span{display:block;transition:rotate .5s cubic-bezier(.3,.8,.35,1)}
  .chip[aria-pressed="true"].turn span{rotate:180deg}
  .chip{
    width:30px;height:30px;border-radius:50%;
    border:1px solid var(--chip-edge);
    background:var(--chip-bg);
    color:var(--ink-soft);
    font:600 14px/1 var(--jp);
    display:grid;place-items:center;
    cursor:pointer;opacity:.6;
    transition:opacity .18s ease, background .4s ease, color .4s ease;
  }
  .chip:hover,.chip:focus-visible{opacity:1}
  .chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .note{
    position:fixed;
    top:max(54px,calc(env(safe-area-inset-top) + 44px));
    left:14px;
    font-size:clamp(52px,14vw,76px);
    line-height:1;
    color:#FFD100;
    text-shadow:0 2px 6px rgba(0,0,0,.4);
    opacity:0;
    pointer-events:none;
    z-index:5;
    transition:opacity .15s ease;
  }
  .note.on{opacity:1;animation:noteShake .15s linear infinite}
  @keyframes noteShake{
    0%,100%{translate:0 0}
    10%{translate:-2px -1px}
    20%{translate:2px 1px}
    30%{translate:-2px 1px}
    40%{translate:2px -1px}
    50%{translate:-1px -2px}
    60%{translate:1px 2px}
    70%{translate:-2px 0}
    80%{translate:2px 0}
    90%{translate:-1px 1px}
  }

  .sheet{
    position:fixed;inset:0;
    display:none;place-items:center;
    background:rgba(30,28,24,.34);
    padding:24px;
    z-index:10;
  }
  .sheet[data-open="1"]{display:grid}
  .sheet .card{
    background:var(--card-bg);
    border:1px solid var(--key-edge);
    border-radius:18px;
    padding:22px 22px 18px;
    max-width:340px;width:100%;
    box-shadow:0 30px 50px -24px rgba(0,0,0,.5);
    font-size:12.5px;line-height:1.85;color:var(--ink-soft);
    /* the credits and the URL are worth being able to select and copy */
    -webkit-user-select:text;user-select:text;
  }
  .sheet h2{
    margin:0 0 10px;font-size:11px;letter-spacing:.3em;text-indent:.3em;
    color:var(--ink);font-weight:800;
  }
  .sheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 16px}
  .sheet dt{font-weight:800;color:var(--ink)}
  .sheet dd{margin:0}
  .sheet .credit{border-top:1px solid var(--card-rule);padding-top:12px;margin:0;font-size:10px;opacity:.7}
  .sheet a{color:var(--ink)}
  .sheet .credit a{color:inherit}
  .sheet .dl{
    display:block;margin-top:16px;padding:10px 11px;
    border-radius:12px;border:1px solid var(--key-edge);
    background:transparent;
    font:800 13px/1 var(--jp);color:var(--ink);
    text-align:center;text-decoration:none;
    transition:background .18s ease;
  }
  .sheet .dl small{
    display:block;margin-top:5px;
    font:600 10px/1 var(--jp);color:var(--ink-soft);
  }
  .sheet .dl:hover,.sheet .dl:focus-visible{background:var(--key-b)}
  .sheet .dl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .sheet .close{
    margin-top:16px;width:100%;padding:11px;
    border-radius:12px;border:1px solid var(--key-edge);
    background:linear-gradient(180deg,var(--key-a),var(--key-b));
    font:800 13px/1 var(--jp);color:var(--ink);cursor:pointer;
  }
  .sheet .dl + .close{margin-top:8px}

  /* ---- qr ---- */
  .corner-left{
    position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;
    display:flex;gap:8px;z-index:5;
  }
  .chip .qr-ico{width:15px;height:15px;display:block}

  .sheet .qrcard{position:relative;max-width:360px;text-align:center}
  .qrclose{
    position:absolute;top:10px;right:10px;
    width:30px;height:30px;border-radius:50%;
    border:1px solid var(--card-rule);
    background:transparent;color:var(--ink-soft);
    font:600 14px/1 var(--jp);
    display:grid;place-items:center;cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .qrclose:hover,.qrclose:focus-visible{background:var(--key-b);color:var(--ink)}
  .qrclose:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .qrbox{
    width:100%;max-width:min(300px,44vh);margin:2px auto 0;
    background:#fff;border-radius:10px;padding:8px;
  }
  .qrbox svg{display:block;width:100%;height:auto}
  .qrurl{
    margin:12px 0 0;font-size:11.5px;color:var(--ink-soft);word-break:break-all;
  }

  @media (prefers-reduced-motion:reduce){
    .paddle{transition:none}
    .paddle.pop,.pulse.go{animation:none}
    .note.on{animation:none}
    .tapzone,.chip.turn span{transition:none}
  }
</style>
</head>
<body>

<div class="corner">
  <button class="chip" id="theme" aria-label="背景を切り替える" aria-pressed="true">◐</button>
  <button class="chip" id="info" aria-label="キー操作と効果音のクレジット">i</button>
</div>

<div class="corner-under">
  <button class="chip turn" id="turn" aria-label="相手に見せる向きに反転する" aria-pressed="false"><span>↻</span></button>
</div>

<div class="corner-left">
  <button class="chip" id="qrbtn" aria-label="このページのQRコードを表示">
    <svg class="qr-ico" viewBox="0 0 12 12" aria-hidden="true">
      <path fill="currentColor" fill-rule="evenodd" d="M0 0h5v5H0zM1.5 1.5h2v2h-2zM7 0h5v5H7zM8.5 1.5h2v2h-2zM0 7h5v5H0zM1.5 8.5h2v2h-2z"/>
      <path fill="currentColor" d="M7 7h2v2H7zM10 7h2v2h-2zM7 10h2v2H7zM10 10h2v2h-2z"/>
    </svg>
  </button>
</div>

<div class="note" id="note" aria-hidden="true">♪</div>

<div class="stage">

    <div class="paddle" id="paddle">
      <div class="face front" data-mark="maru">
        <div class="nub"></div>
        <div class="disc">
          <div class="ring"></div>
          <div class="cross"><i></i><i></i></div>
          <div class="clapmark"><i class="clapimg"></i></div>
          <div class="grille"></div>
          <div class="pulse"></div>
        </div>
        <div class="handle"><span class="btn-dot"></span><span class="seam"></span></div>
        <div class="contact"></div>
      </div>
      <div class="face back" data-mark="batsu">
        <div class="nub"></div>
        <div class="disc">
          <div class="ring"></div>
          <div class="cross"><i></i><i></i></div>
          <div class="clapmark"><i class="clapimg"></i></div>
          <div class="grille"></div>
          <div class="pulse"></div>
        </div>
        <div class="handle"><span class="btn-dot"></span><span class="seam"></span></div>
        <div class="contact"></div>
      </div>
    </div>
  </div>
  <button class="half left" id="tapM" aria-label="正解（ピンポン）"></button>
  <button class="half right" id="tapB" aria-label="不正解（ブー）"></button>
</div>

<div class="clapbar">

    <i class="clapimg"></i>拍手
  </button>
</div>

<div class="controls">

    <span class="glyph">○</span>
  </button>
  <button class="key batsu" id="keyB" aria-label="不正解（ブー）">
    <span class="glyph">✕</span>
  </button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="操作と効果音のクレジット">
  <div class="card">
    <h2>キー操作</h2>
    <dl>
      <dt>1 / O</dt><dd>○ 正解</dd>
      <dt>2 / X</dt><dd>✕ 不正解</dd>
      <dt>3 / C</dt><dd>拍手</dd>
      <dt>スペース</dt><dd>裏返す</dd>
      <dt>B</dt><dd>背景の白／黒</dd>
    </dl>
    <p class="credit">
      効果音：OtoLogic（<a href="https://otologic.jp" target="_blank" rel="noopener">otologic.jp</a>）／ CC BY 4.0<br>

    </a>

  </div>
</div>

<div class="sheet" id="qrsheet" role="dialog" aria-modal="true" aria-label="このページのQRコード">
  <div class="card qrcard">
    <button class="qrclose" id="qrclose" aria-label="閉じる">✕</button>
    <h2>スマホで開く</h2>
    <div class="qrbox">

qqqkxBTUUzLjk5Lv/7IGT4gZDCEMdAIzDID4AY5gAAAAMYLxrAgGBAZAAjGAAAADWqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqTEFNRTMuOTkuNaqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqr/+xBk9QPwpg7HQAEw6AZgCNAAAAGCfEEhAAzBYAAAP8AAAASqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqv/7EGToD/CWC0YoARjQAeAIwAAAAQAAAf4AAAAgAAA/wAAABKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//sQZN2P8AAAf4AAAAgAAA/wAAABAAAB/gAAACAAAD/AAAAEqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqr/+xBk3Y/wAAB/gAAACAAAD/AAAAEAAAH+AAAAIAAAP8AAAASqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqv/7EGTdj/AAAH+AAAAIAAAP8AAAAQAAAf4AAAAgAAA/wAAABKqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq//sQZN2P8AAAf4AAAAgAAA/wAAABAAAB/gAAACAAAD/AAAAEqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqr/+xBk3Y/wAAB/gAAACAAAD/AAAAEAAAH+AAAAIAAAP8AAAASqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqg=="
  };

  var paddle = document.getElementById('paddle');
  var rot = 0;
  var showing = 'maru';

  /* ---------- audio ---------- */
  var ctx = null, buffers = {}, fallback = {};

  function b64ToBytes(b64){
    var bin = atob(b64), len = bin.length, out = new Uint8Array(len);
    for(var i=0;i<len;i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function initAudio(){
    if(ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ initFallback(); return; }
    ctx = new AC();
    Object.keys(SRC).forEach(function(k){
      var bytes = b64ToBytes(SRC[k].split(',')[1]).buffer;
      var p = ctx.decodeAudioData(bytes);
      if(p && p.then){
        p.then(function(buf){ buffers[k] = buf; }).catch(initFallback);
      }else{
        ctx.decodeAudioData(bytes, function(buf){ buffers[k]=buf; }, initFallback);
      }
    });
  }

  function initFallback(){
    if(fallback.maru) return;
    Object.keys(SRC).forEach(function(k){
      var a = new Audio(SRC[k]); a.preload='auto'; fallback[k]=a;
    });
  }

  /* ---------- note icon: shakes while a sound is actually playing ---------- */
  var noteEl = document.getElementById('note');
  var noteTimer = null;
  function noteOn(){
    clearTimeout(noteTimer);
    noteEl.classList.add('on');
    noteTimer = setTimeout(noteOff, 6000);
  }
  function noteOff(){
    clearTimeout(noteTimer);
    noteEl.classList.remove('on');
  }

  function play(kind){
    initAudio();
    noteOn();
    if(ctx){
      if(ctx.state === 'suspended') ctx.resume();
      if(buffers[kind]){
        var s = ctx.createBufferSource();
        s.buffer = buffers[kind];
        s.connect(ctx.destination);
        s.onended = noteOff;
        s.start(0);
        return;
      }
    }
    initFallback();
    var a = fallback[kind];
    if(a){
      a.onended = noteOff;
      try{ a.currentTime = 0; a.play(); }catch(e){ noteOff(); }
    } else {
      noteOff();
    }
  }

  /* ---------- visuals ---------- */
  /* The paddle has two physical faces but three marks. The requested mark is
     painted onto whichever face is turned away, then the paddle flips to show
     it — so the same 180° flip works for any pair of marks. */
  var faceEls = [document.querySelector('.face.front'), document.querySelector('.face.back')];
  var shown = 0;
  var hideTimer = null;
  var HIDE_AFTER = 3000;

  function pulse(face){
    var el = face.querySelector('.pulse');
    el.classList.remove('go');
    void el.offsetWidth;
    el.classList.add('go');
  }

  function fire(kind){
    clearTimeout(hideTimer);
    faceEls[0].classList.remove('hide');
    faceEls[1].classList.remove('hide');

    var flipped = showing !== kind;
    if(flipped){
      faceEls[1 - shown].dataset.mark = kind;
      rot += 180;
      paddle.style.transform = 'rotateY(' + rot + 'deg)';
      shown = 1 - shown;
      showing = kind;
    }
    var face = faceEls[shown];
    paddle.classList.remove('pop');
    void paddle.offsetWidth;
    paddle.classList.add('pop');
    play(kind);
    setTimeout(function(){ pulse(face); }, flipped ? 180 : 0);

    hideTimer = setTimeout(function(){ face.classList.add('hide'); }, HIDE_AFTER);
  }

  function flip(){ fire(showing === 'maru' ? 'batsu' : 'maru'); }

  /* Sound on pointerdown, not click: click only lands once the finger lifts and
     is dropped outright if the finger drifts, which is what made taps feel dead.
     keydown keeps Enter/Space working for whoever tabs to the button. */
  function bindFire(id, kind){
    var el = document.getElementById(id);
    el.addEventListener('pointerdown', function(e){
      if(e.pointerType === 'mouse' && e.button !== 0) return;
      fire(kind);
    });
    el.addEventListener('keydown', function(e){
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fire(kind); }
    });
  }
  bindFire('keyM', 'maru');
  bindFire('keyB', 'batsu');
  bindFire('keyC', 'clap');
  bindFire('tapM', 'maru');
  bindFire('tapB', 'batsu');

  /* ---------- theme ---------- */
  var themeBtn = document.getElementById('theme');
  function toggleTheme(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    themeBtn.setAttribute('aria-pressed', dark ? 'false' : 'true');
  }
  themeBtn.addEventListener('click', toggleTheme);

  /* ---------- turn the toy to face the other person ---------- */
  var turnBtn = document.getElementById('turn');
  turnBtn.addEventListener('click', function(){
    var facing = document.querySelector('.tapzone').classList.toggle('facing');
    turnBtn.setAttribute('aria-pressed', facing ? 'true' : 'false');
  });

  /* ---------- info sheet ---------- */
  var sheet = document.getElementById('sheet');
  function openSheet(){ sheet.dataset.open = '1'; document.getElementById('close').focus(); }
  function closeSheet(){ sheet.dataset.open = ''; }
  document.getElementById('info').addEventListener('click', openSheet);
  document.getElementById('close').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function(e){ if(e.target === sheet) closeSheet(); });

  /* ---------- qr sheet ---------- */
  var qrsheet = document.getElementById('qrsheet');
  function openQr(){ qrsheet.dataset.open = '1'; document.getElementById('qrclose').focus(); }
  function closeQr(){ qrsheet.dataset.open = ''; }
  document.getElementById('qrbtn').addEventListener('click', openQr);
  document.getElementById('qrclose').addEventListener('click', closeQr);
  qrsheet.addEventListener('click', function(e){ if(e.target === qrsheet) closeQr(); });

  document.addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.key === 'Escape'){ closeSheet(); closeQr(); return; }
    if(sheet.dataset.open === '1' || qrsheet.dataset.open === '1') return;
    var k = e.key.toLowerCase();
    if(k === '1' || k === 'o'){ e.preventDefault(); fire('maru'); }
    else if(k === '2' || k === 'x'){ e.preventDefault(); fire('batsu'); }
    else if(k === '3' || k === 'c'){ e.preventDefault(); fire('clap'); }
    else if(k === 'b'){ e.preventDefault(); toggleTheme(); }
    else if(k === ' ' || k === 'enter'){
      var a = document.activeElement;
      if(a && a.tagName === 'BUTTON') return;
      e.preventDefault(); flip();
    }
  });

  ['pointerdown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, initAudio, {once:true, passive:true});
  });

  /* offline cache — only when served over http(s); a local file:// copy is
     already self-contained, so registration is skipped there */
  /* the save link only makes sense on a served copy — a local file:// copy is
     already the very file it would hand out */
  if(location.protocol.indexOf('http') === 0){
    document.getElementById('dl').hidden = false;
  }

  if(location.protocol.indexOf('http') === 0 && 'serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
