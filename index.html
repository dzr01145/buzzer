<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>○×ブザー</title>
<meta name="theme-color" content="#131215">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!--
  効果音: OtoLogic (https://otologic.jp) / CC BY 4.0
  Quiz-Ding_Dong03 (Short) , Quiz-Buzzer02 (Long)
-->
<style>
  :root{
    --plastic-edge:#C9C7C0;
    --maru:#DF3229;
    --batsu:#1E56B6;
    --d: clamp(160px, min(84vw, 33vh), 380px);
    --jp: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;

    /* light (studio sweep) */
    --bg: radial-gradient(120% 70% at 50% 14%, #FFFFFF 0%, transparent 62%),
          linear-gradient(180deg,#F2F1EC 0%,#F2F1EC 46%,#DFDDD5 100%);
    --ink:#25231F;
    --ink-soft:#6E6A61;
    --key-a:#FFFFFF;
    --key-b:#F0EEE8;
    --key-edge:#C9C7C0;
    --key-lip:#CFCCC4;
    --chip-bg:rgba(255,255,255,.6);
    --chip-edge:rgba(0,0,0,.14);
    --card-bg:#FFFDF9;
    --card-rule:rgba(0,0,0,.1);
    --contact:rgba(0,0,0,.30);
    --rim:0 22px 30px -18px rgba(0,0,0,.4);
  }

  html[data-theme="dark"]{
    --bg: radial-gradient(105% 62% at 50% 20%, #34313A 0%, #1E1C22 52%, #131215 100%);
    --ink:#F2F0EA;
    --ink-soft:#9A958C;
    --key-a:#2E2B32;
    --key-b:#232128;
    --key-edge:#413E47;
    --key-lip:#141317;
    --chip-bg:rgba(255,255,255,.08);
    --chip-edge:rgba(255,255,255,.18);
    --card-bg:#26242B;
    --card-rule:rgba(255,255,255,.12);
    --contact:rgba(0,0,0,.62);
    --rim:0 26px 44px -20px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.05);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:var(--jp);
    color:var(--ink);
    background:var(--bg);
    transition:background .4s ease, color .4s ease;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    gap:clamp(10px,2.5vh,24px);
    padding:max(18px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));
    -webkit-tap-highlight-color:transparent;
    overflow:hidden;
  }

  /* ---- stage ---- */
  .stage{
    flex:1 1 auto;
    display:flex;align-items:center;justify-content:center;
    pointer-events:none;
    perspective:1400px;
    width:100%;
    min-height:0;
  }
  .tapzone{display:block}

  .paddle{
    position:relative;
    width:var(--d);
    height:calc(var(--d) * 1.72);
    transform-style:preserve-3d;
    transform-origin:50% 90%;
    transition:transform .58s cubic-bezier(.18,.86,.24,1);
  }
  .paddle.pop{animation:buzz .62s cubic-bezier(.25,.7,.35,1)}
  @keyframes buzz{
    0%  {translate:0 0;      rotate:0deg}
    7%  {translate:-5px -7px;rotate:-2.6deg}
    18% {translate:5px -3px; rotate:2.2deg}
    30% {translate:-4px -1px;rotate:-1.6deg}
    43% {translate:3px 0;    rotate:1.15deg}
    57% {translate:-2px 0;   rotate:-.75deg}
    72% {translate:2px 0;    rotate:.45deg}
    86% {translate:-1px 0;   rotate:-.2deg}
    100%{translate:0 0;      rotate:0deg}
  }

  .face{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;
  }
  .face.back{transform:rotateY(180deg)}

  .nub{
    width:calc(var(--d)*.085);height:calc(var(--d)*.062);
    background:linear-gradient(180deg,#FFF,#DAD8D1);
    border:1px solid var(--plastic-edge);
    border-bottom:0;
    border-radius:4px 4px 0 0;
    margin-bottom:-2px;
  }

  .disc{
    position:relative;
    width:var(--d);height:var(--d);
    border-radius:50%;
    background:radial-gradient(78% 66% at 32% 22%, #FFFFFF 0%, #FBFBF9 42%, #EDEBE5 100%);
    border:1px solid var(--plastic-edge);
    box-shadow:
      inset 0 -10px 22px rgba(0,0,0,.07),
      inset 0 4px 10px rgba(255,255,255,.9),
      var(--rim);
    display:grid;place-items:center;
  }

  .ring{
    width:calc(var(--d)*.70);height:calc(var(--d)*.70);
    border-radius:50%;
    border:calc(var(--d)*.145) solid var(--maru);
    box-shadow:0 1px 0 rgba(0,0,0,.06);
  }

  .cross{position:absolute;width:100%;height:100%;display:grid;place-items:center}
  .cross i{
    position:absolute;
    width:calc(var(--d)*.80);height:calc(var(--d)*.145);
    background:linear-gradient(180deg,#2A62C4,#1B4EA8);
    border-radius:2px;
  }
  .cross i:first-child{transform:rotate(45deg)}
  .cross i:last-child{transform:rotate(-45deg)}

  .ring,.cross{transition:opacity .55s ease}
  .face.hide .ring,.face.hide .cross{opacity:0}

  .grille{
    position:absolute;
    width:calc(var(--d)*.30);height:calc(var(--d)*.30);
    border-radius:50%;
    background-image:radial-gradient(circle, rgba(20,20,20,.62) 1.5px, transparent 1.7px);
    background-size:calc(var(--d)*.038) calc(var(--d)*.038);
    background-position:center;
  }

  .handle{
    width:calc(var(--d)*.235);
    height:calc(var(--d)*.76);
    margin-top:calc(var(--d)*-.035);
    border-radius:0 0 calc(var(--d)*.06) calc(var(--d)*.06);
    background:linear-gradient(90deg,#EFEDE7 0%,#FFFFFF 26%,#FCFCFA 62%,#DEDCD5 100%);
    border:1px solid var(--plastic-edge);
    border-top:0;
    position:relative;
    box-shadow:0 16px 22px -16px rgba(0,0,0,.45);
  }
  .btn-dot{
    position:absolute;left:50%;top:calc(var(--d)*.055);translate:-50% 0;
    width:calc(var(--d)*.115);height:calc(var(--d)*.115);
    border-radius:50%;
    background:radial-gradient(70% 70% at 40% 32%,#FFF,#E4E2DB);
    border:1px solid var(--plastic-edge);
    box-shadow:inset 0 -2px 3px rgba(0,0,0,.1);
  }
  .seam{
    position:absolute;left:14%;right:14%;bottom:calc(var(--d)*.16);
    height:1px;background:rgba(0,0,0,.12);
  }

  .contact{
    position:absolute;left:50%;bottom:calc(var(--d)*-.05);
    translate:-50% 0;
    width:calc(var(--d)*.9);height:calc(var(--d)*.09);
    background:radial-gradient(50% 50% at 50% 50%, var(--contact), transparent 70%);
    filter:blur(3px);pointer-events:none;
  }
  .pulse{
    position:absolute;left:50%;top:calc(var(--d)*.5);
    translate:-50% -50%;
    width:var(--d);height:var(--d);border-radius:50%;
    border:2px solid currentColor;
    opacity:0;pointer-events:none;
  }
  .pulse.go{animation:pulse .7s ease-out}
  @keyframes pulse{
    0%{opacity:.55;scale:.86}
    100%{opacity:0;scale:1.5}
  }

  /* ---- controls ---- */
  .controls{
    flex:0 0 auto;
    display:flex;gap:0;justify-content:center;
    width:calc(100% + 40px);
    margin:0 -20px calc(-1 * max(22px, env(safe-area-inset-bottom)));
    padding:0;
  }
  .key{
    flex:1 1 50%;
    position:relative;overflow:hidden;
    height:clamp(120px, 20vh, 190px);
    padding-bottom:max(0px, env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    border:0;
    background:linear-gradient(180deg,var(--key-a),var(--key-b));
    box-shadow:0 -6px 22px -14px rgba(0,0,0,.5);
    font-family:inherit;
    color:var(--ink);cursor:pointer;
    transition:background .4s ease, color .4s ease, filter .08s ease;
  }
  /* outer top corners sweep up; the pair meets in the middle */
  .key.maru {border-radius:44px 0 0 0; padding-right:8%; border-right:1px solid var(--key-edge)}
  .key.batsu{border-radius:0 44px 0 0; padding-left:8%}

  /* soft colour bloom rising from the outer corner */
  .key::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(72% 92% at var(--bloom-x) 112%, var(--tint) 0%, transparent 68%);
  }
  .key.maru {--tint:rgba(223,50,41,.22); --bloom-x:16%}
  .key.batsu{--tint:rgba(30,86,182,.24); --bloom-x:84%}

  .key:active{filter:brightness(.93)}
  .key:focus-visible{outline:3px solid var(--ink);outline-offset:-6px}
  .key .glyph{
    position:relative;
    font-size:clamp(44px,13vw,72px);line-height:1;font-weight:400;
  }
  .key.maru .glyph{color:var(--maru)}
  .key.batsu .glyph{color:var(--batsu)}
  html[data-theme="dark"] .key.maru .glyph{color:#F4584D}
  html[data-theme="dark"] .key.batsu .glyph{color:#5D8FEC}
  .key .txt{position:relative;text-align:center;font-size:14px;font-weight:800;letter-spacing:.14em;text-indent:.14em}
  .key small{display:block;font-size:9px;font-weight:600;color:var(--ink-soft);letter-spacing:.22em;text-indent:.22em;margin-top:3px}

  /* ---- info ---- */
  .corner{
    position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;
    display:flex;gap:8px;z-index:5;
  }
  .chip{
    width:30px;height:30px;border-radius:50%;
    border:1px solid var(--chip-edge);
    background:var(--chip-bg);
    color:var(--ink-soft);
    font:600 14px/1 var(--jp);
    display:grid;place-items:center;
    cursor:pointer;opacity:.6;
    transition:opacity .18s ease, background .4s ease, color .4s ease;
  }
  .chip:hover,.chip:focus-visible{opacity:1}
  .chip:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .sheet{
    position:fixed;inset:0;
    display:none;place-items:center;
    background:rgba(30,28,24,.34);
    padding:24px;
    z-index:10;
  }
  .sheet[data-open="1"]{display:grid}
  .sheet .card{
    background:var(--card-bg);
    border:1px solid var(--key-edge);
    border-radius:18px;
    padding:22px 22px 18px;
    max-width:340px;width:100%;
    box-shadow:0 30px 50px -24px rgba(0,0,0,.5);
    font-size:12.5px;line-height:1.85;color:var(--ink-soft);
  }
  .sheet h2{
    margin:0 0 10px;font-size:11px;letter-spacing:.3em;text-indent:.3em;
    color:var(--ink);font-weight:800;
  }
  .sheet dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 16px}
  .sheet dt{font-weight:800;color:var(--ink)}
  .sheet dd{margin:0}
  .sheet .credit{border-top:1px solid var(--card-rule);padding-top:12px;margin:0}
  .sheet a{color:var(--ink)}
  .sheet .close{
    margin-top:16px;width:100%;padding:11px;
    border-radius:12px;border:1px solid var(--key-edge);
    background:linear-gradient(180deg,var(--key-a),var(--key-b));
    font:800 13px/1 var(--jp);color:var(--ink);cursor:pointer;
  }

  @media (prefers-reduced-motion:reduce){
    .paddle{transition:none}
    .paddle.pop,.pulse.go{animation:none}
  }
</style>
</head>
<body>

<div class="corner">
  <button class="chip" id="theme" aria-label="背景を切り替える" aria-pressed="true">◐</button>
  <button class="chip" id="info" aria-label="キー操作と効果音のクレジット">i</button>
</div>

<div class="stage">
  <div class="tapzone" aria-hidden="true">
    <div class="paddle" id="paddle">
      <div class="face front">
        <div class="nub"></div>
        <div class="disc">
          <div class="ring"></div>
          <div class="grille"></div>
          <div class="pulse" id="pulseM" style="color:var(--maru)"></div>
        </div>
        <div class="handle"><span class="btn-dot"></span><span class="seam"></span></div>
        <div class="contact"></div>
      </div>
      <div class="face back">
        <div class="nub"></div>
        <div class="disc">
          <div class="cross"><i></i><i></i></div>
          <div class="grille"></div>
          <div class="pulse" id="pulseB" style="color:var(--batsu)"></div>
        </div>
        <div class="handle"><span class="btn-dot"></span><span class="seam"></span></div>
        <div class="contact"></div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="key maru" id="keyM">
    <span class="glyph">○</span>
    <span class="txt">正解<small>PING PONG</small></span>
  </button>
  <button class="key batsu" id="keyB">
    <span class="glyph">✕</span>
    <span class="txt">不正解<small>BUZZER</small></span>
  </button>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="操作と効果音のクレジット">
  <div class="card">
    <h2>キー操作</h2>
    <dl>
      <dt>1 / O</dt><dd>○ 正解</dd>
      <dt>2 / X</dt><dd>✕ 不正解</dd>
      <dt>スペース</dt><dd>裏返す</dd>
      <dt>B</dt><dd>背景の白／黒</dd>
    </dl>
    <p class="credit">効果音：OtoLogic（<a href="https://otologic.jp" target="_blank" rel="noopener">otologic.jp</a>）／ CC BY 4.0</p>
    <button class="close" id="close">閉じる</button>
  </div>
</div>

  };

  var paddle = document.getElementById('paddle');
  var rot = 0;
  var showing = 'maru';

  /* ---------- audio ---------- */
  var ctx = null, buffers = {}, fallback = {};

  function b64ToBytes(b64){
    var bin = atob(b64), len = bin.length, out = new Uint8Array(len);
    for(var i=0;i<len;i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function initAudio(){
    if(ctx) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ initFallback(); return; }
    ctx = new AC();
    Object.keys(SRC).forEach(function(k){
      var bytes = b64ToBytes(SRC[k].split(',')[1]).buffer;
      var p = ctx.decodeAudioData(bytes);
      if(p && p.then){
        p.then(function(buf){ buffers[k] = buf; }).catch(initFallback);
      }else{
        ctx.decodeAudioData(bytes, function(buf){ buffers[k]=buf; }, initFallback);
      }
    });
  }

  function initFallback(){
    if(fallback.maru) return;
    Object.keys(SRC).forEach(function(k){
      var a = new Audio(SRC[k]); a.preload='auto'; fallback[k]=a;
    });
  }

  function play(kind){
    initAudio();
    if(ctx){
      if(ctx.state === 'suspended') ctx.resume();
      if(buffers[kind]){
        var s = ctx.createBufferSource();
        s.buffer = buffers[kind];
        s.connect(ctx.destination);
        s.start(0);
        return;
      }
    }
    initFallback();
    var a = fallback[kind];
    if(a){ try{ a.currentTime = 0; a.play(); }catch(e){} }
  }

  /* ---------- visuals ---------- */
  function pulse(kind){
    var el = document.getElementById(kind === 'maru' ? 'pulseM' : 'pulseB');
    el.classList.remove('go');
    void el.offsetWidth;
    el.classList.add('go');
  }

  var faces = {
    maru:  document.querySelector('.face.front'),
    batsu: document.querySelector('.face.back')
  };
  var hideTimer = null;
  var HIDE_AFTER = 3000;

  function fire(kind){
    clearTimeout(hideTimer);
    faces.maru.classList.remove('hide');
    faces.batsu.classList.remove('hide');

    var flipped = showing !== kind;
    if(flipped){
      rot += 180;
      paddle.style.transform = 'rotateY(' + rot + 'deg)';
      showing = kind;
    }
    paddle.classList.remove('pop');
    void paddle.offsetWidth;
    paddle.classList.add('pop');
    play(kind);
    setTimeout(function(){ pulse(kind); }, flipped ? 180 : 0);

    hideTimer = setTimeout(function(){ faces[kind].classList.add('hide'); }, HIDE_AFTER);
  }

  function flip(){ fire(showing === 'maru' ? 'batsu' : 'maru'); }

  document.getElementById('keyM').addEventListener('click', function(){ fire('maru'); });
  document.getElementById('keyB').addEventListener('click', function(){ fire('batsu'); });

  /* ---------- theme ---------- */
  var themeBtn = document.getElementById('theme');
  function toggleTheme(){
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
    themeBtn.setAttribute('aria-pressed', dark ? 'false' : 'true');
  }
  themeBtn.addEventListener('click', toggleTheme);

  /* ---------- info sheet ---------- */
  var sheet = document.getElementById('sheet');
  function openSheet(){ sheet.dataset.open = '1'; document.getElementById('close').focus(); }
  function closeSheet(){ sheet.dataset.open = ''; }
  document.getElementById('info').addEventListener('click', openSheet);
  document.getElementById('close').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function(e){ if(e.target === sheet) closeSheet(); });

  document.addEventListener('keydown', function(e){
    if(e.repeat) return;
    if(e.key === 'Escape'){ closeSheet(); return; }
    if(sheet.dataset.open === '1') return;
    var k = e.key.toLowerCase();
    if(k === '1' || k === 'o'){ e.preventDefault(); fire('maru'); }
    else if(k === '2' || k === 'x'){ e.preventDefault(); fire('batsu'); }
    else if(k === 'b'){ e.preventDefault(); toggleTheme(); }
    else if(k === ' ' || k === 'enter'){
      var a = document.activeElement;
      if(a && a.tagName === 'BUTTON') return;
      e.preventDefault(); flip();
    }
  });

  ['pointerdown','touchstart'].forEach(function(ev){
    document.addEventListener(ev, initAudio, {once:true, passive:true});
  });

  /* offline cache — only when served over http(s); a local file:// copy is
     already self-contained, so registration is skipped there */
  if(location.protocol.indexOf('http') === 0 && 'serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
